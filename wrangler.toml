name = "treefort"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# custom domain — live as of the great nameserver migration of july 2026
# (must sit above the [[...]] tables or TOML adopts it into one of them)
routes = [
  { pattern = "treefort.lol", custom_domain = true },
  { pattern = "www.treefort.lol", custom_domain = true }
]

# Static files are served through the Worker for fort routing. Root legacy
# room URLs also hit the Worker, so they cannot bypass the fort slug model.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/*/api/*",
  "/paint",
  "/paint.html",
  "/kitchen",
  "/kitchen.html",
  "/gifmachine",
  "/gifmachine.html",
  "/handbook",
  "/handbook.html",
  "/*/paint",
  "/*/paint.html",
  "/*/kitchen",
  "/*/kitchen.html",
  "/*/gifmachine",
  "/*/gifmachine.html",
  "/*/handbook",
  "/*/handbook.html"
]

[[d1_databases]]
binding = "DB"
database_name = "fort"
database_id = "adfda621-91d1-413f-bb21-a3623cfb71fe"   # from: wrangler d1 create fort

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "fort-media"


# secrets (set via `wrangler secret put`, never committed):
#   SESSION_SECRET — long random string, signs session cookies
