name = "treefort"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# static fort files — served directly when the path matches a file,
# everything else (i.e. /api/*) falls through to the worker
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "fort"
database_id = "PASTE_YOUR_D1_ID_HERE"   # from: wrangler d1 create fort

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "fort-media"

# custom domain — uncomment AFTER the zone is on cloudflare (DEPLOY.md step 6)
# routes = [
#   { pattern = "treefort.lol", custom_domain = true },
#   { pattern = "www.treefort.lol", custom_domain = true }
# ]

# secrets (set via `wrangler secret put`, never committed):
#   SESSION_SECRET — long random string, signs session cookies
